name: Build and Deploy PJ_Idea

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: containerdeploytrial.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push frontend image
        run: |
          docker build \
            -t containerdeploytrial.azurecr.io/pj_idea-frontend:${{ github.sha }} \
            -f frontend/Dockerfile \
            frontend/
          docker push containerdeploytrial.azurecr.io/pj_idea-frontend:${{ github.sha }}

      - name: Build & push backend image
        run: |
          docker build \
            -t containerdeploytrial.azurecr.io/pj_idea-backend:${{ github.sha }} \
            -f backend/Dockerfile \
            backend/
          docker push containerdeploytrial.azurecr.io/pj_idea-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: Actionable-front
          images: containerdeploytrial.azurecr.io/pj_idea-frontend:${{ github.sha }}

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: Actionable-back
          images: containerdeploytrial.azurecr.io/pj_idea-backend:${{ github.sha }}
